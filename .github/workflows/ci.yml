name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can only read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 24 is the oldest version the package supports (engines >=24.2); 26 is the one used in development.
        node: ['24', '26']
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit
