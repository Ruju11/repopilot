name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can only read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json requires node >=24.2; this resolves to the latest 24.x.
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run verify
        env:
          # Linux must be able to create symbolic links. With this set, a link test whose
          # fixture cannot be created FAILS instead of being skipped.
          REQUIRE_LINK_TESTS: '1'
